plugins {
    id 'com.android.application'
}

def vendorMain = file("${rootProject.projectDir}/.vendor-rp1210/app/src/main")
def releaseTag = System.getenv("RELEASE_TAG") ?: "v0.3.0-dev"
def appVersionName = releaseTag.startsWith("v") ?
        releaseTag.substring(1) : releaseTag
def semanticVersion = appVersionName.split(/[-+]/)[0].tokenize('.')
def appVersionCode = (semanticVersion[0] as int) * 1000000 +
        (semanticVersion[1] as int) * 1000 +
        (semanticVersion[2] as int)

tasks.register('verifyVendorPayload') {
    doLast {
        if (!vendorMain.exists()) {
            throw new GradleException(
                    "Android RP1210 vendor payload is not staged. Run src/android/build.bat or build.sh.")
        }
    }
}

android {
    namespace 'com.irontom10.calibrationtransfer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.irontom10.calibrationtransfer'
        minSdk 24
        targetSdk 33
        versionCode appVersionCode
        versionName appVersionName

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = [new File(vendorMain, "jniLibs")]
            assets.srcDirs = [
                    'src/main/assets',
                    new File(vendorMain, "assets")
            ]
        }
    }

    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
        }
    }

    buildTypes {
        release {
            /*
             * Pre-release artifacts remain installable without requiring a
             * private signing secret in forks.  The variant itself is Release;
             * production signing can replace this config without changing the
             * build/release pipeline.
             */
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('verifyVendorPayload')
}
