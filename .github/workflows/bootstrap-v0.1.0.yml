name: bootstrap v0.1.0

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/bootstrap-v0.1.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out v0.1.0
        uses: actions/checkout@v4
        with:
          ref: v0.1.0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build tagged source
        shell: cmd
        run: build.bat

      - name: Prepare release assets
        shell: pwsh
        run: |
          $version = "v0.1.0"
          $source = "build/app/CumminsCalTransfer.exe"
          $asset = "build/app/CumminsCalTransfer-$version-win-x86.exe"

          if (!(Test-Path $source)) {
              throw "Expected build output not found: $source"
          }

          Copy-Item $source $asset -Force

          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          $name = Split-Path $asset -Leaf
          "$hash  $name" | Set-Content "$asset.sha256" -Encoding ascii

      - name: Create v0.1.0 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "v0.1.0"
          $asset = "build/app/CumminsCalTransfer-$version-win-x86.exe"
          $checksum = "$asset.sha256"

          gh release view "$version" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload "$version" "$asset" "$checksum" --clobber --repo "$env:GITHUB_REPOSITORY"
          }
          else {
              gh release create "$version" "$asset" "$checksum" `
                  --verify-tag `
                  --generate-notes `
                  --title "Cummins CAL Transfer $version" `
                  --repo "$env:GITHUB_REPOSITORY"
          }
