name: neutralize v0.1.0 notes

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/refresh-v0.1.0.yml'

permissions:
  contents: write

jobs:
  edit-release:
    runs-on: ubuntu-latest
    steps:
      - name: Replace generated release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v0.1.0 --repo "$GITHUB_REPOSITORY" \
            --title "Calibration Transfer v0.1.0" \
            --notes "Initial public release of Calibration Transfer."
