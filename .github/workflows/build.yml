name: build

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  windows-x86:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build Windows x86
        shell: cmd
        run: build.bat

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86
          path: build/app/CalibrationTransfer.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            src/android/*.gradle
            src/android/app/*.gradle

      - name: Install Android native build tools
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Cache official NEXIQ mobile SDK
        uses: actions/cache@v4
        with:
          path: src/android/.nexiq-cache
          key: nexiq-rp1210-mobile-sdk-v1

      - name: Build Android
        shell: bash
        run: |
          chmod +x build-android.sh src/android/build.sh src/android/gradlew
          ./build-android.sh

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: src/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
