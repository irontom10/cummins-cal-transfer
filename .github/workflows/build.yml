name: build

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  protocol-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and run native protocol tests
        shell: bash
        run: |
          mkdir -p build/tests

          cc -std=c89 -Wall -Wextra -pedantic -Isrc/core \
            tests/clip_cal_protocol_test.c \
            src/core/clip_cal.c \
            src/core/ccal_crc.c \
            src/core/ct_platform.c \
            -o build/tests/clip_cal_protocol_test

          cc -std=c89 -Wall -Wextra -pedantic -Isrc/core \
            tests/j1939_transport_test.c \
            src/core/j1939_transport.c \
            src/core/ct_platform.c \
            -o build/tests/j1939_transport_test

          build/tests/clip_cal_protocol_test
          build/tests/j1939_transport_test

  windows-x86:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build Windows x86
        shell: cmd
        run: build.bat

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86
          path: build/app/CalibrationTransfer.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            src/android/*.gradle
            src/android/app/*.gradle

      - name: Install Android native build tools
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          attempt=1
          while ! "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          do
            if [ "$attempt" -ge 3 ]; then
              echo "Android SDK package installation failed after 3 attempts."
              exit 1
            fi

            attempt=$((attempt + 1))
            echo "Android SDK package installation failed; retrying attempt $attempt of 3..."
            rm -rf "$ANDROID_HOME/.temp"
            rm -rf "$ANDROID_HOME/ndk/27.0.12077973"
            rm -rf "$HOME/.android/cache"
            sleep 5
          done

      - name: Cache official NEXIQ mobile SDK
        uses: actions/cache@v4
        with:
          path: src/android/.nexiq-cache
          key: nexiq-rp1210-mobile-sdk-v1

      - name: Build Android
        shell: bash
        run: |
          chmod +x build-android.sh src/android/build.sh src/android/gradlew
          ./build-android.sh

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: src/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
