name: build

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  protocol-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and run native protocol tests
        shell: bash
        run: |
          mkdir -p build/tests

          cc -std=c89 -Wall -Wextra -pedantic -Isrc/core \
            tests/clip_cal_protocol_test.c \
            src/core/clip_cal.c \
            src/core/j_endian.c \
            src/core/xcal_crc.c \
            src/core/j_string.c \
            src/core/ct_platform.c \
            -o build/tests/clip_cal_protocol_test

          cc -std=c89 -Wall -Wextra -pedantic -Isrc/core \
            tests/j1939_transport_test.c \
            src/core/j1939_transport.c \
            src/core/ct_platform.c \
            -o build/tests/j1939_transport_test

          cc -std=c89 -Wall -Wextra -pedantic -Isrc/core \
            tests/clip_secure_seed_test.c \
            src/core/clip_crypto.c \
            src/core/j_endian.c \
            -o build/tests/clip_secure_seed_test

          cc -std=c89 -Wall -Wextra -Werror -pedantic -Isrc/core \
            tests/j_endian_test.c src/core/j_endian.c \
            -o build/tests/j_endian_test

          cc -std=c89 -Wall -Wextra -Werror -pedantic -Isrc/core \
            tests/j_string_test.c src/core/j_string.c \
            -o build/tests/j_string_test

          cc -std=c89 -Wall -Wextra -Werror -pedantic -Isrc/core \
            -c src/core/config_store.c -o build/tests/config_store.o

          build/tests/j_string_test
          build/tests/j_endian_test
          build/tests/clip_cal_protocol_test
          build/tests/j1939_transport_test
          build/tests/clip_secure_seed_test

  windows-x86:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build default LLVM x86 WinAPI
        shell: cmd
        run: build.bat

      - name: Verify default executable size
        shell: pwsh
        run: |
          $exe = Get-Item 'build/app/CalibrationTransfer.exe'
          Write-Host ("Default WinAPI EXE: {0:N0} bytes" -f $exe.Length)
          if ($exe.Length -gt 102400) { throw "Default EXE should be the compact LLVM x86 build (under 100 KiB)." }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86
          path: build/app/CalibrationTransfer.exe
          if-no-files-found: error

  windows-x64:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build native LLVM x64 WinAPI
        shell: cmd
        run: build-x64.bat

      - name: Verify PE32+ x64 executable
        shell: pwsh
        run: |
          $path = 'build/x64/app/CalibrationTransfer.exe'
          $bytes = [System.IO.File]::ReadAllBytes($path)
          if ($bytes.Length -lt 256) { throw 'Missing/invalid x64 executable.' }
          $offset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($offset -lt 0x40 -or $offset + 26 -gt $bytes.Length) {
            throw 'Invalid PE header offset.'
          }
          $signature = [BitConverter]::ToUInt32($bytes, $offset)
          $machine = [BitConverter]::ToUInt16($bytes, $offset + 4)
          $magic = [BitConverter]::ToUInt16($bytes, $offset + 24)
          if ($signature -ne 0x4550 -or $machine -ne 0x8664 -or $magic -ne 0x20b) {
            throw ('Expected PE32+ AMD64; got signature={0:X} machine={1:X} magic={2:X}' -f $signature, $machine, $magic)
          }
          Write-Host ("Verified PE32+ x64 binary: {0:N0} bytes" -f $bytes.Length)

      - name: Upload Windows x64 build
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: build/x64/app/CalibrationTransfer.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            src/android/*.gradle
            src/android/app/*.gradle

      - name: Install Android native build tools
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          attempt=1
          while ! "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          do
            if [ "$attempt" -ge 3 ]; then
              echo "Android SDK package installation failed after 3 attempts."
              exit 1
            fi

            attempt=$((attempt + 1))
            echo "Android SDK package installation failed; retrying attempt $attempt of 3..."
            rm -rf "$ANDROID_HOME/.temp"
            rm -rf "$ANDROID_HOME/ndk/27.0.12077973"
            rm -rf "$HOME/.android/cache"
            sleep 5
          done

      - name: Cache official NEXIQ mobile SDK
        uses: actions/cache@v4
        with:
          path: src/android/.nexiq-cache
          key: nexiq-rp1210-mobile-sdk-v1

      - name: Build Android
        shell: bash
        run: |
          chmod +x build-android.sh src/android/build.sh src/android/gradlew
          ./build-android.sh

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: src/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


  publish-latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - protocol-tests
      - windows-x86
      - windows-x64
      - android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-x86
          path: latest-input/windows

      - name: Download Windows x64 build
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: latest-input/windows-x64

      - name: Download Android build
        uses: actions/download-artifact@v4
        with:
          name: android
          path: latest-input/android

      - name: Publish builds/latest
        shell: bash
        run: |
          rm -rf builds/latest
          mkdir -p builds/latest

          # The default LLVM x86 EXE is small enough to commit directly.
          # The file here is the actual runnable binary, not a ZIP wrapper.
          cp latest-input/windows/CalibrationTransfer.exe \
            builds/latest/CalibrationTransfer-win-x86.exe

          cp latest-input/windows-x64/CalibrationTransfer.exe \
            builds/latest/CalibrationTransfer-win-x64.exe

          cp latest-input/android/app-debug.apk \
            builds/latest/CalibrationTransfer-android.apk

          (
            cd builds/latest
            sha256sum CalibrationTransfer-win-x86.exe \
              > CalibrationTransfer-win-x86.exe.sha256
            sha256sum CalibrationTransfer-win-x64.exe \
              > CalibrationTransfer-win-x64.exe.sha256
            sha256sum CalibrationTransfer-android.apk \
              > CalibrationTransfer-android.apk.sha256
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f -- builds/latest

          if git diff --cached --quiet; then
            echo "builds/latest is already current."
            exit 0
          fi

          git commit -m "Update latest build artifacts [skip ci]"
          git push origin HEAD:master
