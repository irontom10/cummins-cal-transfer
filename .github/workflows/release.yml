name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-x86-release:
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        shell: cmd
        run: build.bat

      - name: Prepare release assets
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          $source = "build/app/CalibrationTransfer.exe"
          $asset = "build/app/CalibrationTransfer-$version-win-x86.exe"

          if (!(Test-Path $source)) {
              throw "Expected build output not found: $source"
          }

          Copy-Item $source $asset -Force

          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          $name = Split-Path $asset -Leaf
          "$hash  $name" | Set-Content "$asset.sha256" -Encoding ascii

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME
          $asset = "build/app/CalibrationTransfer-$version-win-x86.exe"
          $checksum = "$asset.sha256"

          gh release view "$version" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload "$version" "$asset" "$checksum" --clobber --repo "$env:GITHUB_REPOSITORY"
          }
          else {
              gh release create "$version" "$asset" "$checksum" `
                  --verify-tag `
                  --generate-notes `
                  --title "Calibration Transfer $version" `
                  --repo "$env:GITHUB_REPOSITORY"
          }
